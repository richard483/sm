<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Gen</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        input, select, textarea, button { width: 100%; margin-bottom: 1rem; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #preview-container { text-align: center; margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem; display: none; }
        #output-img { width: 100%; border-radius: 8px; margin-bottom: 1rem; }
        label { font-size: 0.9em; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Gemini Generator</h2>
        
        <input type="password" id="pass" placeholder="Enter App Password">
        
        <label for="modelSelect">Select Model</label>
        <select id="modelSelect">
            <option value="gemini-3-pro-image-preview" selected>Gemini 3 Pro Image (Strongest / High Fidelity)</option>
            <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash Image (Fast / 4K capable)</option>
            <option value="gemini-2.5-flash-image">Gemini 2.5 Flash Image (Fast / Legacy)</option>
        </select>

        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Describe the image..." rows="3"></textarea>
        
        <label for="imageInput">Optional Reference Image</label>
        <input type="file" id="imageInput" accept="image/*">
        
        <button id="genBtn">Generate Image</button>

        <div id="preview-container">
            <img id="output-img" src="" alt="Generated image">
            <button id="dlBtn" style="background: #28a745;">Download Image</button>
        </div>
    </div>

    <script>
        const genBtn = document.getElementById('genBtn');
        const dlBtn = document.getElementById('dlBtn');

        // Helper function to read file as base64
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                base64: reader.result.split(',')[1],
                mimeType: file.type
            });
            reader.onerror = error => reject(error);
        });

        genBtn.onclick = async () => {
            const prompt = document.getElementById('prompt').value;
            const password = document.getElementById('pass').value;
            const model = document.getElementById('modelSelect').value;
            const imageFile = document.getElementById('imageInput').files[0];
            const preview = document.getElementById('preview-container');
            
            if(!prompt || !password) return alert("Prompt and Password required");

            genBtn.disabled = true;
            genBtn.innerText = "Generating...";

            try {
                let payload = { prompt, model };

                // If an image is selected, convert it before sending
                if (imageFile) {
                    const imgData = await fileToBase64(imageFile);
                    payload.imageBase64 = imgData.base64;
                    payload.mimeType = imgData.mimeType;
                }

                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'x-app-password': password, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "Check password or API quota");
                }

                const data = await response.json();
                const imgTag = document.getElementById('output-img');
                imgTag.src = `data:image/png;base64,${data.image}`;
                preview.style.display = 'block';

                dlBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.href = imgTag.src;
                    link.download = 'gemini-generated.png';
                    link.click();
                };
            } catch (err) {
                alert(err.message);
            } finally {
                genBtn.disabled = false;
                genBtn.innerText = "Generate Image";
            }
        };
    </script>
</body>
</html>
